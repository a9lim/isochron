<body class="sim-body">
  <header class="colophon">
    <a class="colophon-seal" href="/" title="a9l.im" data-icon="seal" data-icon-size="24"></a>
    <h1 class="colophon-name">Isochron</h1>
    <div class="colophon-tools" role="toolbar" aria-label="Simulation">
      <button id="play-btn" class="colophon-btn" data-colophon="play"></button>
      <button id="step-btn" class="colophon-btn" data-colophon="step" data-icon="step"></button>
      <button id="theme-btn" class="colophon-btn" data-colophon="theme" data-icon="theme"></button>
      <button id="about-btn" class="colophon-btn" data-colophon="help" data-icon="about"></button>
    </div>
  </header>

  <main class="planet">
    <figure class="globe">
      <div class="globe-stage">
        <canvas id="globe-gpu" aria-hidden="true"></canvas>
        <canvas id="globe-overlay" class="cursor-grab" aria-label="A globe of an Earth-like planet: its relief and plate boundaries, its climate zones or winds, its weather chart, or its tides"></canvas>
        <p id="globe-nogpu" class="globe-notice" role="status" hidden>This globe needs WebGPU.</p>
        <div class="globe-head">
          <div class="globe-head-row">
          <div id="view-picker" class="view-picker" role="radiogroup" aria-label="View">
            <button class="view-btn" data-view="relief" role="radio" aria-checked="true">Relief</button>
            <button class="view-btn" data-view="climate" role="radio" aria-checked="false">Climate</button>
            <button class="view-btn" data-view="weather" role="radio" aria-checked="false">Weather</button>
            <button class="view-btn" data-view="tides" role="radio" aria-checked="false">Tides</button>
          </div>
          <button id="key-btn" class="key-btn" aria-pressed="true" aria-controls="globe-key">Key</button>
          </div>
          <div id="wx-picker" class="view-picker wx-picker" role="radiogroup" aria-label="Weather map" hidden>
            <button class="view-btn" data-wx="pressure" role="radio" aria-checked="true">Pressure</button>
            <button class="view-btn" data-wx="temperature" role="radio" aria-checked="false">Temperature</button>
            <button class="view-btn" data-wx="humidity" role="radio" aria-checked="false">Humidity</button>
          </div>
          <div id="cl-picker" class="view-picker wx-picker" role="radiogroup" aria-label="Climate map" hidden>
            <button class="view-btn" data-cl="zones" role="radio" aria-checked="true">Zones</button>
            <button class="view-btn" data-cl="air" role="radio" aria-checked="false">Air</button>
          </div>
        </div>
        <div id="globe-key" class="globe-key"><canvas id="key-canvas" aria-label="Key to the view's symbols"></canvas></div>
      </div>
      <figcaption class="figure-bar">
        <p class="caption globe-caption"><span class="caption-n">Fig. 1.</span> <span id="globe-caption"></span></p>
        <label class="dial knob" id="knob" hidden>
          <span class="dial-label" id="knob-label"></span>
          <input id="knob-input" type="range" aria-label="The experiment's knob">
          <output id="knob-out" for="knob-input"></output>
        </label>
        <label class="dial">
          <span class="dial-label">Rate</span>
          <input id="dial" type="range" min="-3.5" max="7" step="0.05" value="6" aria-label="Simulated time per second, on a logarithmic scale">
          <output id="dial-out" for="dial">1 Myr/s</output>
        </label>
      </figcaption>
    </figure>

    <aside class="margin" aria-label="Figures">
      <div class="margin-tabs" role="tablist" aria-label="Figures">
        <button class="tab-btn" data-tab="experiments" role="tab" aria-selected="false" tabindex="-1">Experiments</button>
        <button class="tab-btn active" data-tab="record" role="tab" aria-selected="true">Record</button>
        <button class="tab-btn" data-tab="climate" role="tab" aria-selected="false" tabindex="-1">Climate</button>
        <button class="tab-btn" data-tab="crust" role="tab" aria-selected="false" tabindex="-1">Crust</button>
        <button class="tab-btn" data-tab="model" role="tab" aria-selected="false" tabindex="-1">Model</button>
      </div>
      <div class="margin-panels">
        <div class="tab-panel" id="tab-experiments" role="tabpanel">
          <ol id="experiments" class="experiments" aria-label="Experiments"></ol>
        </div>
        <div class="tab-panel active" id="tab-record" role="tabpanel">
          <figure class="fig">
            <canvas id="fig-record" class="fig-canvas fig-record" aria-label="The planet's record: temperature, CO₂, sea level, ice, land and ridge activity over time"></canvas>
            <figcaption class="caption"><span class="caption-n">Fig. 2.</span> <span id="cap-record"></span></figcaption>
          </figure>
          <figure class="fig">
            <canvas id="fig-orbit" class="fig-canvas fig-orbit" aria-label="The orbit's eccentricity, obliquity and precession, and July sunlight at 65°N"></canvas>
            <figcaption class="caption"><span class="caption-n">Fig. 3.</span> <span id="cap-orbit"></span></figcaption>
          </figure>
        </div>
        <div class="tab-panel" id="tab-climate" role="tabpanel">
          <figure class="fig">
            <canvas id="fig-zonal" class="fig-canvas fig-tall" aria-label="Temperature and precipitation by latitude, with the seasonal range of temperature, the ITCZ's range and the Hadley cells' edges"></canvas>
            <figcaption class="caption"><span class="caption-n">Fig. 4.</span> <span id="cap-zonal"></span></figcaption>
          </figure>
          <h2 class="margin-head">Zones, % of land</h2>
          <canvas id="zone-key" class="zone-key" aria-label="Key to the climate zones"></canvas>
        </div>
        <div class="tab-panel" id="tab-crust" role="tabpanel">
          <figure class="fig">
            <canvas id="fig-hyps" class="fig-canvas fig-tall" aria-label="Share of the surface by elevation"></canvas>
            <figcaption class="caption"><span class="caption-n">Fig. 5.</span> <span id="cap-hyps"></span></figcaption>
          </figure>
          <figure class="fig">
            <canvas id="fig-pol" class="fig-canvas fig-strip" aria-label="The polarity of the field over the last 160 million years"></canvas>
            <figcaption class="caption"><span class="caption-n">Fig. 6.</span> <span id="cap-pol"></span></figcaption>
          </figure>
        </div>
        <div class="tab-panel" id="tab-model" role="tabpanel">
          <figure class="fig">
            <canvas id="fig-model" class="fig-canvas fig-model" aria-label="The model: every layer and every coupling between them, each arrow as heavy as its flux"></canvas>
            <figcaption class="caption"><span class="caption-n">Fig. 7.</span> <span id="cap-model"></span></figcaption>
          </figure>
        </div>
      </div>
    </aside>
  </main>
</body>
